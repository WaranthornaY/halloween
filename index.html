
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halloween Camera</title>
<style>
body{font-family:Arial;background:#171020;color:white;text-align:center;padding:18px}
h1{color:#ffad42}
video{width:100%;max-width:640px;background:#000;border-radius:12px}
button{padding:13px;margin:6px;border:0;border-radius:8px;background:#ffad42;font-weight:bold}
#status{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>🎃 Halloween Camera</h1>
<p>Keep this page open while playing.</p>
<video id="preview" autoplay muted playsinline></video><br>
<button id="start">Start Camera & Connect</button>
<button id="stop" disabled>Stop Camera</button>
<p id="status">Scan the laptop QR code to begin.</p>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const preview = document.getElementById("preview");
const status = document.getElementById("status");
const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");

let peer = null, stream = null, call = null, starting = false;

function stopCamera() {
  if (call) { call.close(); call = null; }
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  if (peer) { peer.destroy(); peer = null; }
  preview.srcObject = null;
  startButton.disabled = false;
  stopButton.disabled = true;
  starting = false;
}

async function startCamera() {
  if (starting || stream) return;
  starting = true;
  startButton.disabled = true;

  try {
    const laptopId = new URLSearchParams(location.search).get("peer");
    if (!laptopId) throw new Error("Missing laptop ID. Scan the fresh QR code on the laptop.");
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia)
      throw new Error("Open this page using HTTPS.");
    if (typeof Peer === "undefined")
      throw new Error("PeerJS failed to load. Check internet and reload.");

    status.textContent = "Requesting camera...";
    stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode:{ideal:"environment"},width:{ideal:640}},
      audio:false
    });
    preview.srcObject = stream;
    await preview.play();
    status.textContent = "Camera working. Connecting to laptop...";

    peer = new Peer();
    peer.on("open", () => {
      if (!stream) return;
      call = peer.call(laptopId, stream);
      if (!call) {
        status.textContent = "Could not create video call.";
        return;
      }
      call.on("close", () => {
        status.textContent = "Video call closed. Restart both pages.";
      });
      call.on("error", e => status.textContent = "Call error: " + e.message);
      status.textContent = "Camera working. Waiting for laptop...";
    });
    peer.on("error", e => status.textContent =
      "PeerJS error: " + e.type + " — " + e.message);
    peer.on("disconnected", () => status.textContent =
      "Signaling disconnected. Check internet.");
    stopButton.disabled = false;
  } catch (e) {
    status.textContent = (e.name || "Error") + ": " + e.message;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    preview.srcObject = null;
    startButton.disabled = false;
  } finally {
    starting = false;
  }
}

startButton.onclick = startCamera;
stopButton.onclick = () => {
  stopCamera();
  status.textContent = "Camera stopped.";
};
window.addEventListener("pagehide", stopCamera);
</script>
</body>
</html>
