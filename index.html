
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Android Camera Test</title>
<style>
body{font:16px Arial;background:#171020;color:white;padding:18px}
button{padding:12px;background:#ffad42;border:0;border-radius:8px}
video{width:100%;margin-top:16px;background:black}
</style>
</head>
<body>
<h2>🎃 Halloween Camera Test</h2>
<button id="start">Start camera</button>
<button id="stop">Stop camera</button>
<video id="preview" autoplay muted playsinline></video>
<p id="status">Ready to test.</p>
<script>
let stream;
const status = document.getElementById("status");
document.getElementById("start").onclick = async () => {
  try {
    status.textContent = "Checking camera...";
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Camera API unavailable. Check HTTPS and Chrome.");
    }
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });
    document.getElementById("preview").srcObject = stream;
    status.textContent = "Camera started successfully.";
  } catch (e) {
    status.textContent = e.name + ": " + e.message;
  }
};
document.getElementById("stop").onclick = () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  document.getElementById("preview").srcObject = null;
  status.textContent = "Camera stopped.";
};
</script>
</body>
</html>
